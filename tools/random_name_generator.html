<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Name Generator - Lightweight Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <header class="bg-white shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="../index.html" class="text-blue-600 hover:text-blue-800 font-medium">
        ← Back to Home
      </a>
      <span class="text-gray-500 text-sm">Free Online Tools</span>
    </div>
  </header>

    <div class="max-w-5xl mx-auto px-4 py-10">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-2">Random Name Generator</h1>
        <p class="text-center text-gray-500 mb-10">Generate real, nickname or funny names from different countries.</p>

        <div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow-sm">
            <!-- Country -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Country / Style</label>
                <select id="country" class="w-full border border-gray-300 rounded px-3 py-2">
                    <option value="us">United States (English)</option>
                    <option value="cn">China (Chinese Style)</option>
                    <option value="jp">Japan</option>
                    <option value="kr">Korea</option>
                    <option value="ru">Russia</option>
                    <option value="in">India</option>
                    <option value="fr">France</option>
                    <option value="de">Germany</option>
                </select>
            </div>

            <!-- Last Name -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Last Name (optional, fill if you want fixed surname)</label>
                <input id="lastName" type="text" placeholder="e.g. Smith / Wang / Tanaka" class="w-full border border-gray-300 rounded px-3 py-2">
            </div>

            <!-- Name Type -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Name Type</label>
                <select id="nameType" class="w-full border border-gray-300 rounded px-3 py-2">
                    <option value="real">Real Name (Formal)</option>
                    <option value="nick">Online Nickname</option>
                    <option value="funny">Funny / Cute Name</option>
                </select>
            </div>

            <!-- Count -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Generate Count</label>
                <select id="count" class="w-full border border-gray-300 rounded px-3 py-2">
                    <option value="5">5 names</option>
                    <option value="10">10 names</option>
                    <option value="15">15 names</option>
                </select>
            </div>

            <!-- Button -->
            <button id="generateBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded transition">
                Generate Names
            </button>

            <!-- Result -->
            <div class="mt-6">
                <h3 class="font-medium mb-2 text-gray-800">Result</h3>
                <div id="resultArea" class="border rounded p-4 min-h-[120px] bg-gray-50 space-y-2"></div>
            </div>
        </div>
    </div>

    <footer class="bg-white py-8 border-t border-gray-200 mt-10">
        <div class="max-w-5xl mx-auto px-4 text-center text-gray-500 text-sm">
            <p class="mb-2">© 2026 Lightweight Tools. All tools run locally in your browser, no data is uploaded to any server.</p>
            <div class="space-x-4">
                <a href="../privacy.html" class="text-gray-500 hover:text-gray-700 transition-colors">Privacy Policy</a>
                <a href="../about_us.html" class="text-gray-500 hover:text-gray-700 transition-colors">About Us</a>
                <a href="../contact_us.html" class="text-gray-500 hover:text-gray-700 transition-colors">Contact Us</a>
            </div>
        </div>
    </footer>

    <script>
        // ====== 姓名库 ======
        const data = {
            us: {
                realLast: ["Smith", "Johnson", "Williams", "Brown", "Jones", "Garcia", "Miller", "Davis"],
                realFirst: ["James", "Mary", "Robert", "Patricia", "John", "Jennifer", "Michael", "Linda"],
                nick: ["Sunny", "Lucky", "Tiny", "Breeze", "Spark", "Cloud", "Sweet", "Cool"],
                funny: ["Silly", "Wacky", "Goofy", "Puffy", "Fluffy", "Noodle", "Pizza", "Cookie"]
            },
            cn: {
                realLast: ["Wang", "Li", "Zhang", "Liu", "Chen", "Yang", "Huang", "Zhao"],
                realFirst: ["Wei", "Fang", "Li", "Juan", "Hong", "Tao", "Min", "Qiang"],
                nick: ["Moon", "Star", "Cloud", "Wind", "Light", "Summer", "Snow", "Leaf"],
                funny: ["Cute", "Chubby", "Sweetie", "Bunny", "Panda", "Dumpling", "Mochi", "Cake"]
            },
            jp: {
                realLast: ["Tanaka", "Suzuki", "Takahashi", "Watanabe", "Ito", "Yamamoto", "Nakamura"],
                realFirst: ["Haruto", "Yui", "Ren", "Aoi", "Hinata", "Riku", "Kanon", "Yuna"],
                nick: ["Mochi", "Hana", "Yuki", "Aoi", "Sora", "Kira", "Momo", "Rin"],
                funny: ["Chibi", "Puni", "Mame", "Tako", "Kawaii", "Bocchi", "Neko", "Usagi"]
            },
            kr: {
                realLast: ["Kim", "Lee", "Park", "Choi", "Jung", "Kang", "Jo", "Yoon"],
                realFirst: ["Jihoon", "Minji", "Seoyeon", "Junwoo", "Chaewon", "Hyunwoo", "Sooah"],
                nick: ["Star", "Bling", "Honey", "Coco", "Lulu", "Didi", "Mimi", "Bubu"],
                funny: ["Pudding", "Tofu", "Bubble", "Cheese", "Potato", "Peach", "Mango", "Tiger"]
            },
            ru: {
                realLast: ["Ivanov", "Smirnov", "Kuznetsov", "Popov", "Sokolov", "Mikhailov"],
                realFirst: ["Alexander", "Maria", "Maxim", "Anastasia", "Dmitry", "Elena"],
                nick: ["Vikky", "Sasha", "Misha", "Katya", "Dima", "Ivan", "Lena", "Tasha"],
                funny: ["Bear", "Wolf", "Snow", "Vodka", "Matryoshka", "Balalaika"]
            },
            in: {
                realLast: ["Patel", "Sharma", "Singh", "Kumar", "Gupta", "Das", "Reddy", "Mehta"],
                realFirst: ["Arjun", "Sita", "Vikram", "Priya", "Rahul", "Aisha", "Raj", "Anjali"],
                nick: ["Raj", "Sonu", "Monu", "Chotu", "Golu", "Riya", "Anu", "Chiki"],
                funny: ["Mango", "Coconut", "Samosa", "Lassi", "Ghee", "Pani", "Biryani"]
            },
            fr: {
                realLast: ["Martin", "Bernard", "Dubois", "Thomas", "Robert", "Richard", "Petit"],
                realFirst: ["Jean", "Marie", "Pierre", "Sophie", "Paul", "Julie", "Lucas", "Emma"],
                nick: ["Belle", "Beau", "Lune", "Bleu", "Cheri", "Chou", "Mimi", "Lolo"],
                funny: ["Croissant", "Baguette", "Macaron", "Fraise", "Chocolat", "Fromage"]
            },
            de: {
                realLast: ["Müller", "Schmidt", "Schneider", "Fischer", "Weber", "Meyer"],
                realFirst: ["Lukas", "Hannah", "Leon", "Lena", "Felix", "Emma", "Ben", "Mia"],
                nick: ["Hans", "Greta", "Klaus", "Heidi", "Fritz", "Gretel", "Otto", "Liesel"],
                funny: ["Bratwurst", "Pretzel", "Beer", "Schokolade", "Kuchen", "Wurst"]
            }
        };

        // 生成
        document.getElementById('generateBtn').addEventListener('click', () => {
            const country = document.getElementById('country').value;
            const lastName = document.getElementById('lastName').value.trim();
            const nameType = document.getElementById('nameType').value;
            const count = parseInt(document.getElementById('count').value);

            const pool = data[country];
            const list = [];

            for (let i = 0; i < count; i++) {
                const last = lastName || pool.realLast[Math.floor(Math.random() * pool.realLast.length)];
                let first;
                if (nameType === 'real') first = pool.realFirst[Math.floor(Math.random() * pool.realFirst.length)];
                else if (nameType === 'nick') first = pool.nick[Math.floor(Math.random() * pool.nick.length)];
                else first = pool.funny[Math.floor(Math.random() * pool.funny.length)];
                list.push(first + " " + last);
            }

            const area = document.getElementById('resultArea');
            area.innerHTML = list.map(n => `<div class="text-gray-800">• ${n}</div>`).join('');
        });
    </script>
</body>
</html>
